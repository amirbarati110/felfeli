name: Prepare Pars Pack release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use PHP 8.4 required by locked dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, zip
          coverage: none

      - name: Install dependencies and verify application
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate --no-ansi
          npm ci
          npm run build
          php artisan test
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Build private app and two public document roots
        run: |
          mkdir -p release/felfeli-app release/public_html release/admin
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='release/' \
            --exclude='.env' \
            . release/felfeli-app/
          mkdir -p release/felfeli-app/storage/framework/{cache/data,sessions,testing,views}
          mkdir -p release/felfeli-app/storage/{app/public,logs}
          cp -a public/. release/public_html/
          cp -a public/. release/admin/
          cp deploy/index.php release/public_html/index.php
          cp deploy/index.php release/admin/index.php
          cd release
          zip -qr ../felfeli-release.zip felfeli-app public_html admin

      - name: Save release archive for secure cPanel upload
        uses: actions/upload-artifact@v4
        with:
          name: felfeli-release
          path: felfeli-release.zip
          retention-days: 1
