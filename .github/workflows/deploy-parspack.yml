name: Prepare and upload Pars Pack release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use PHP 8.4 required by locked dependencies
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, zip
          coverage: none

      - name: Install dependencies and verify application
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate --no-ansi
          php artisan test
          npm ci
          npm run build
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Build private app and two public document roots
        run: |
          mkdir -p release/felfeli-app release/public_html release/admin
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='release/' \
            --exclude='.env' \
            . release/felfeli-app/
          mkdir -p release/felfeli-app/storage/framework/{cache/data,sessions,testing,views}
          mkdir -p release/felfeli-app/storage/{app/public,logs}
          cp -a public/. release/public_html/
          cp -a public/. release/admin/
          cp deploy/index.php release/public_html/index.php
          cp deploy/index.php release/admin/index.php
          cd release
          zip -qr ../felfeli-release.zip felfeli-app public_html admin

      - name: Upload release archive over encrypted FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import ssl
          from ftplib import FTP_TLS

          required = ('FTP_SERVER', 'FTP_USERNAME', 'FTP_PASSWORD')
          if any(not os.environ.get(name) for name in required):
              raise SystemExit('Required FTP secrets are missing.')

          ftp = FTP_TLS(context=ssl.create_default_context(), timeout=30)
          ftp.connect(os.environ['FTP_SERVER'], int(os.environ.get('FTP_PORT') or '21'))
          ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          name = f"felfeli-release-{os.environ['GITHUB_SHA'][:12]}.zip"
          with open('felfeli-release.zip', 'rb') as archive:
              ftp.storbinary(f'STOR {name}', archive, blocksize=1024 * 1024)
          ftp.quit()
          print(f'Release archive uploaded to the configured FTP account: {name}')
          PY
